<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AirQuality ESP32</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font: 16px system-ui, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #d7fff4;
            background: #000;
        }

        button,
        select {
            font: inherit;
            padding: .55rem .8rem;
            margin: .25rem .25rem .25rem 0;
            color: #d7fff4;
            background: #071512;
            border: 1px solid #29d9ad;
            border-radius: 3px;
        }

        button:disabled,
        select:disabled {
            color: #54736c;
            border-color: #29463f;
        }

        button:not(:disabled):hover {
            background: #10382d;
        }

        #status {
            padding: .7rem;
            background: #071512;
            border-left: 3px solid #29d9ad;
            margin: 1rem 0;
        }


        canvas {
            width: 100%;
            height: 360px;
            border: 1px solid #1c6654;
            margin-top: 1rem;
        }


        #csvFiles {
            margin: .75rem 0;
            color: #8fffe0;
        }
    </style>
</head>

<body>
    <h1>AirQuality ESP32</h1>
    <button id="connect">Connect ESP32</button>
    <select id="file" disabled>
        <option>Get list of CSV files</option>
    </select>
    <div id="status">Disconnected</div>
    <ul id="fileList"></ul>
    <script>
        const serviceUuid = '4fa8691a-1360-4c27-ba5c-057245417c92';
        const dataUuid = '4fa8691b-1360-4c27-ba5c-057245417c92';
        const commandUuid = '4fa8691c-1360-4c27-ba5c-057245417c92';
        let dataCharacteristic, commandCharacteristic, transfer = '', transferType = '', transferTimer;
        const $ = id => document.getElementById(id);
        function setStatus(message) { $('status').textContent = message; }
        function handleData(event) {
            const chunk = new TextDecoder().decode(event.target.value);
            console.info('BLE data:', chunk);
            transfer += chunk;
            if (transfer.includes('BEGIN LIST\n') && transfer.includes('END LIST\n')) {
                const files = transfer.split('BEGIN LIST\n')[1].split('END LIST\n')[0].split(/\r?\n/).filter(Boolean);
                $('fileList').innerHTML = files.map(name => `<li>${name}</li>`).join('');
                transfer = '';
            }
        }


        $('connect').onclick = async () => {
            try {
                console.info('Connecting to Bluetooth device...');
                if (!navigator.bluetooth) throw new Error('Web Bluetooth is unavailable. Use Chrome or Edge over HTTPS.');
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [serviceUuid] }] });
                const server = await device.gatt.connect(); const service = await server.getPrimaryService(serviceUuid);
                dataCharacteristic = await service.getCharacteristic(dataUuid); commandCharacteristic = await service.getCharacteristic(commandUuid);
                await dataCharacteristic.startNotifications(); dataCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                setStatus(`Connected to ${device.name || 'ESP32'}`);
                console.info('Connected to Bluetooth device.');

                await commandCharacteristic.writeValue(new TextEncoder().encode('LIST'));
                console.info('Sent LIST command.');

            } catch (error) { setStatus("Encountered error connecting: " + error.message); }
        };



    </script>
</body>

</html>
