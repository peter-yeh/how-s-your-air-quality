<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AirQuality ESP32</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>AirQuality ESP32</h1>
    <button id="ConnectESP32">Connect ESP32</button>
    <div id="status">Disconnected</div>
    <div id="brightnessControl" style="display: none;" class="control-panel">
        <label for="brightnessSlider">Screen Brightness</label>
        <div class="slider-container">
            <input type="range" id="brightnessSlider" min="1" max="100" value="1" disabled>
            <span id="brightnessValue" aria-live="polite">Loading...</span>
        </div>
        <div style="margin-top: 15px;">
            <label>Graph Mode: <span id="graphModeValue" aria-live="polite">Loading...</span></label>
            <div class="radio-group" style="margin-top: 5px;">
                <label style="margin-right: 10px;"><input type="radio" name="graphMode" value="0" disabled>
                    Seconds</label>
                <label style="margin-right: 10px;"><input type="radio" name="graphMode" value="1" disabled>
                    Minutes</label>
                <label><input type="radio" name="graphMode" value="2" disabled> Hours</label>
            </div>
        </div>
    </div>
    <ul id="fileList"></ul>
    <div id="graphContainer">
        <canvas id="graph" height="360"></canvas>
    </div>
    <script src="script.js"></script>
</body>

</html>
